[project]
name = "scout-ai-backend"
version = "0.1.0"
description = "SCOUT AI - autonomous multi-agent research platform (backend)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.162,<0.163",
  "uvicorn[standard]>=0.54,<0.55",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "sqlalchemy[asyncio]>=2.1,<2.2",
  "alembic>=1.20,<2",
  "psycopg[binary,pool]>=3.3,<4",
  "pgvector>=0.5,<0.6",
  "langgraph>=1.2,<1.3",
  "openai>=3.46,<4",
  "tiktoken>=0.14,<0.15",
  "httpx>=0.28,<0.29",
  "trafilatura>=2.3,<3",
  "pypdf>=6.21,<7",
  "sse-starlette>=3.6,<4",
  "structlog>=26.1",
  "tenacity>=9.2,<10",
  "python-multipart>=0.0.33",
  "markdown-it-py>=4,<5",
]

[dependency-groups]
dev = [
  "pytest>=9.2",
  "pytest-asyncio>=1.4",
  "ruff>=0.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "integration: requires PostgreSQL with pgvector (TEST_DATABASE_URL)",
  "live: makes real paid API calls (OPENAI_API_KEY / TAVILY_API_KEY); skipped by default",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008", "ASYNC109"]
